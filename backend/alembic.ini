# Alembic configuration for the nearform_todo_app backend.
# The database URL is NOT hard-coded here; env.py reads it from the application
# Settings (DATABASE_URL env var, 12-factor) so migrations and the app share one
# source of truth. Migrations run before the server starts (AD-11).

[alembic]
script_location = migrations
prepend_sys_path = .
# Use os.pathsep-separated path; keep default file template.
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
