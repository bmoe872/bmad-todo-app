# Single-origin server block (AD-10). Installed at /etc/nginx/conf.d/default.conf,
# replacing the stock block. nginx serves the built SPA AND reverse-proxies
# /api/* to the `backend` service, so the browser talks to ONE origin and no
# CORS is needed in the composed stack. (CORS is a dev-profile concern, Story 5.3.)
#
# Listens on 8080 — an unprivileged port — so the whole nginx process can run as
# the non-root `nginx` user (binding <1024 would require root). Compose maps the
# host port to this.

server {
    listen      8080;
    server_name _;

    # Don't leak the nginx version.
    server_tokens off;

    # ---- Security response headers (Story 6.3 security pass, NFR-Sec) --------
    # Applied at server scope with `always` so they ride EVERY response
    # (incl. errors). NOTE the nginx add_header inheritance rule: a `location`
    # that declares ANY add_header of its own does NOT inherit these — so the
    # `location /assets/` block below (which sets Cache-Control) re-declares the
    # header that matters for static JS/CSS (X-Content-Type-Options). `location /`
    # (serves index.html — where the CSP actually takes effect) and `location
    # /api/` have no add_header of their own, so they inherit the full set.
    #
    # CSP tuned to what this SPA actually loads: only a same-origin ES-module
    # script (`script-src 'self'` — no inline script in the built index.html);
    # a same-origin stylesheet plus React inline `style=` attributes (the
    # Backdrop canvas), hence `style-src 'self' 'unsafe-inline'` (style injection
    # is low-risk and script-src stays strict); same-origin `fetch('/api')`
    # (`connect-src 'self'`); the lazy-loaded three.js chunk is same-origin
    # (`'self'`) and WebGL/canvas rendering needs no CSP allowance. Framing and
    # base-tag hijacking are denied outright.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # Built SPA assets.
    root  /usr/share/nginx/html;
    index index.html;

    # Reverse-proxy the JSON API to the backend on the internal network.
    # Path-preserving: `proxy_pass` WITHOUT a trailing path keeps the full
    # original URI, so /api/health -> backend /api/health (the backend mounts its
    # router at the /api prefix — do NOT strip it). A trailing slash here would
    # strip the /api prefix and break every route.
    #
    # Dynamic upstream resolution (Story 6.3 ops hardening, closes the 5.2
    # deferred item): resolve the `backend` service name via Docker's embedded
    # DNS (127.0.0.11) at REQUEST time with a short TTL, instead of nginx caching
    # the IP once at config-load for the worker lifetime. Using a variable in
    # `proxy_pass` forces per-request re-resolution, so a backend recreated with
    # a new IP no longer strands the frontend on a stale IP (502). The `set`
    # value carries only scheme+host+port (no URI path), so the full original
    # /api/* URI is still forwarded unchanged — path-preserving as before.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_upstream backend;
        proxy_pass http://$backend_upstream:8000;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # nginx forwards the request method and body by default, so
        # `DELETE /api/todos/completed` with its JSON `{ "ids": [...] }` body
        # (clear-completed, AD-7) passes through intact. Nothing here disables
        # request-body forwarding.
    }

    # Long-cache the content-hashed build assets (filenames change on rebuild).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # This block's own add_header cancels inheritance of the server-level
        # security headers, so re-assert the one that matters for static JS/CSS:
        # nosniff prevents a browser MIME-confusing a hashed asset. (CSP/frame/
        # referrer are document-scoped and irrelevant on an asset response.)
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # SPA fallback: any non-/api path that isn't a real file resolves to the app
    # entry so client-side routes and deep links work.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
