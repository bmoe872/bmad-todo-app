[project]
name = "nearform-todo-backend"
version = "0.1.0"
description = "FastAPI backend for the nearform_todo_app single-user Todo service."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.136,<0.137",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "sqlalchemy>=2.0,<2.1",
    "psycopg[binary]>=3,<4",
    "alembic>=1.14,<2",
    "uvicorn>=0.34,<0.35",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
    "ruff>=0.6,<1",
    # Required by FastAPI's Starlette TestClient for the backend integration/unit suites.
    "httpx>=0.27,<0.29",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
python_files = ["test_*.py"]

# Branch coverage enabled now; the gate stays REPORT-ONLY at this stage.
# The enforcing >=70% meaningful-coverage gate lands in Story 6.2 (see sprint-status.yaml).
[tool.coverage.run]
branch = true
source = ["app"]
omit = [
    # Alembic migrations (generated / DB-tuning code)
    "migrations/*",
    # Config wiring (12-factor env plumbing, not business logic)
    "app/core/config.py",
    # __init__ package markers
    "app/**/__init__.py",
    "app/__init__.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
# Meaningful-coverage exclusions: generated code, config boilerplate, defensive
# guards, and TYPE_CHECKING-only imports. (three.js tuning exclusions live in the
# frontend Vitest config.)
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
