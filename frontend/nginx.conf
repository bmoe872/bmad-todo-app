# Single-origin server block (AD-10). Installed at /etc/nginx/conf.d/default.conf,
# replacing the stock block. nginx serves the built SPA AND reverse-proxies
# /api/* to the `backend` service, so the browser talks to ONE origin and no
# CORS is needed in the composed stack. (CORS is a dev-profile concern, Story 5.3.)
#
# Listens on 8080 — an unprivileged port — so the whole nginx process can run as
# the non-root `nginx` user (binding <1024 would require root). Compose maps the
# host port to this.

server {
    listen      8080;
    server_name _;

    # Don't leak the nginx version.
    server_tokens off;

    # Built SPA assets.
    root  /usr/share/nginx/html;
    index index.html;

    # Reverse-proxy the JSON API to the backend on the internal network.
    # Path-preserving: `proxy_pass` WITHOUT a trailing path keeps the full
    # original URI, so /api/health -> backend /api/health (the backend mounts its
    # router at the /api prefix — do NOT strip it). A trailing slash here would
    # strip the /api prefix and break every route.
    location /api/ {
        proxy_pass http://backend:8000;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # nginx forwards the request method and body by default, so
        # `DELETE /api/todos/completed` with its JSON `{ "ids": [...] }` body
        # (clear-completed, AD-7) passes through intact. Nothing here disables
        # request-body forwarding.
    }

    # Long-cache the content-hashed build assets (filenames change on rebuild).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: any non-/api path that isn't a real file resolves to the app
    # entry so client-side routes and deep links work.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
